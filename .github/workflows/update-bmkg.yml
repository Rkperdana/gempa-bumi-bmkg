name: Sinkronisasi dan publikasi BMKG

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
  # Also callable by the independent scheduled watchdog workflow.
  workflow_call:
  schedule:
    # Every 10 minutes, away from minute 00 to reduce GitHub scheduler congestion.
    # GitHub schedules are best-effort; the independent backup workflow adds resilience.
    - cron: '4,14,24,34,44,54 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rkperdana-gempa-pages
  cancel-in-progress: false

jobs:
  publish:
    # BMKG integration permission confirmed by the site owner.
    # Run for scheduled checks, manual dispatch and code pushes.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate dashboard code
        run: |
          python -m unittest discover -s tests -v
          node --check app.js

      - name: Update earthquake data from BMKG
        run: python scripts/update_data.py

      # Visual smoke tests should never prevent publishing freshly fetched
      # earthquake data. A failure remains visible in the Actions logs.
      - name: Smoke-test interactive map in headless Chrome
        if: ${{ github.event_name != 'schedule' }}
        continue-on-error: true
        run: python scripts/smoke_frontend.py

      - name: Commit only when earthquake records change
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import time

          path = pathlib.Path("data/gempa.json")
          incoming = json.loads(path.read_text(encoding="utf-8"))
          # Preserve the fetched snapshot across resets/retries.
          incoming_text = path.read_text(encoding="utf-8")
          comparable = lambda obj: {k: v for k, v in obj.items() if k != "checked_at"}

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email",
                          "41898282+github-actions[bot]@users.noreply.github.com"], check=True)

          for attempt in range(1, 4):
              # Start each attempt from the latest remote head: simultaneous
              # workflow and editorial commits must not break synchronization.
              subprocess.run(["git", "fetch", "origin", "main"], check=True)
              remote = json.loads(subprocess.check_output(
                  ["git", "show", "origin/main:data/gempa.json"], text=True))
              if str(remote.get("checked_at", "")) >= str(incoming.get("checked_at", "")):
                  print("Remote snapshot is at least as fresh. Do not overwrite it.")
                  path.write_text(json.dumps(remote, ensure_ascii=False, indent=2), encoding="utf-8")
                  sys.exit(0)

              if comparable(remote) == comparable(incoming):
                  print("No event changes; publish new check timestamp without a redundant commit.")
                  sys.exit(0)

              subprocess.run(["git", "reset", "--hard", "origin/main"], check=True)
              path.write_text(incoming_text, encoding="utf-8")
              subprocess.run(["git", "add", "data/gempa.json"], check=True)
              subprocess.run(["git", "commit", "-m", "data: sinkronisasi gempa BMKG"], check=True)
              result = subprocess.run(["git", "push", "origin", "HEAD:main"], check=False)
              if result.returncode == 0:
                  print("Updated data published to main.")
                  sys.exit(0)
              if attempt == 3:
                  raise RuntimeError("Could not publish after 3 concurrent-push retries")
              print("main changed during push; retrying on latest remote revision.")
              time.sleep(attempt)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html styles.css explorer.css app.js _site/
          cp -R assets data _site/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
