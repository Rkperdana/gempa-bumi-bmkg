name: Sinkronisasi dan publikasi BMKG

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
  schedule:
    # Every 15 minutes (UTC); GitHub may delay scheduled executions.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dataloka-gempa-pages
  cancel-in-progress: false

jobs:
  publish:
    # BMKG integration permission confirmed by the site owner.
    # Run for scheduled checks, manual dispatch and code pushes.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate dashboard code
        run: |
          python -m unittest discover -s tests -v
          node --check app.js

      - name: Smoke-test interactive map in headless Chrome
        if: ${{ github.event_name != 'schedule' }}
        run: python scripts/smoke_frontend.py

      - name: Update earthquake data from BMKG
        run: python scripts/update_data.py

      - name: Commit only when earthquake records change
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          current = json.loads(pathlib.Path("data/gempa.json").read_text(encoding="utf-8"))
          previous = json.loads(subprocess.check_output(["git", "show", "HEAD:data/gempa.json"], text=True))
          # checked_at is a page heartbeat; do not create a commit for every poll.
          strip_check = lambda obj: {key: value for key, value in obj.items() if key != "checked_at"}
          if strip_check(previous) == strip_check(current):
              print("No event changes. Deploy current checked_at without a redundant commit.")
              sys.exit(0)

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "data/gempa.json"], check=True)
          subprocess.run(["git", "commit", "-m", "data: sinkronisasi gempa BMKG"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html styles.css explorer.css app.js _site/
          cp -R assets data _site/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
