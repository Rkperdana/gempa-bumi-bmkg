name: Cadangan otomatis sinkronisasi BMKG

on:
  workflow_dispatch:
  # Extra scheduled trigger, independent of the primary update-bmkg schedule.
  # Two checks per hour limit traffic and Pages deploy volume.
  schedule:
    - cron: '13,43 * * * *'
  # Validate the reusable sync workflow whenever this fallback is edited.
  push:
    branches: [main]
    paths:
      - '.github/workflows/schedule-bmkg.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    uses: ./.github/workflows/update-bmkg.yml
    permissions:
      contents: write
      pages: write
      id-token: write
