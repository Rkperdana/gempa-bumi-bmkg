name: Pemicu manual cadangan BMKG

on:
  workflow_dispatch:
  # Validate the reusable sync workflow whenever this fallback is edited.
  push:
    branches: [main]
    paths:
      - '.github/workflows/schedule-bmkg.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    uses: ./.github/workflows/update-bmkg.yml
    permissions:
      contents: write
      pages: write
      id-token: write
