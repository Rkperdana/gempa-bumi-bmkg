name: Cadangan otomatis sinkronisasi BMKG

on:
  workflow_dispatch:
  # Offset backup trigger between the primary ten-minute checks.
  # Six staggered checks per hour fill the five-minute gaps between primary checks.
  schedule:
    - cron: '9,19,29,39,49,59 * * * *'
  # Validate the reusable sync workflow whenever this fallback is edited.
  push:
    branches: [main]
    paths:
      - '.github/workflows/schedule-bmkg.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    uses: ./.github/workflows/update-bmkg.yml
    permissions:
      contents: write
      pages: write
      id-token: write
