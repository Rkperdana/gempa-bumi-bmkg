name: Cadangan otomatis sinkronisasi BMKG

on:
  workflow_dispatch:
  # Offset backup trigger between the primary ten-minute checks.
  # Four checks per hour reduce the longest gap when a primary schedule is skipped.
  schedule:
    - cron: '7,22,37,52 * * * *'
  # Validate the reusable sync workflow whenever this fallback is edited.
  push:
    branches: [main]
    paths:
      - '.github/workflows/schedule-bmkg.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    uses: ./.github/workflows/update-bmkg.yml
    permissions:
      contents: write
      pages: write
      id-token: write
