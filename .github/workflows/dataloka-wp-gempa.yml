name: Dataloka | Gempa BMKG ke WordPress

on:
  pull_request:
    paths:
      - '.github/workflows/dataloka-wp-gempa.yml'
      - 'scripts/dataloka_wp_gempa.py'
      - 'scripts/run-dataloka-gempa.sh'
      - 'tests/test_dataloka_wp_gempa.py'
      - 'scripts/dataloka_gempa_image.py'
      - 'assets/natural-earth-110m-land.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dataloka-wp-gempa.yml'
      - 'scripts/dataloka_wp_gempa.py'
      - 'scripts/run-dataloka-gempa.sh'
  workflow_dispatch:
    inputs:
      mode:
        description: "live (M5,5+) atau dry-run tanpa WordPress"
        required: true
        type: choice
        default: dry-run
        options: [dry-run, live]
      task:
        description: "events (sekali), daily (draf kemarin), keeper (berulang 10 menit)"
        required: true
        type: choice
        default: events
        options: [events, daily, keeper]
  schedule:
    # Six scheduled successors per day. Each keeper spans ~4h20m.
    - cron: '17 0,4,8,12,16,20 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('dataloka-gempa-pr-{0}', github.event.pull_request.number) || 'dataloka-wp-earthquake-only' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow==12.0.0"
      - name: Validate scripts
        run: |
          python -m py_compile scripts/dataloka_wp_gempa.py scripts/dataloka_gempa_image.py
          bash -n scripts/run-dataloka-gempa.sh
      - name: Run unit tests without WordPress credentials
        run: python -m unittest discover -s tests -p test_dataloka_wp_gempa.py -v
      - name: Ensure tests leave real publication ledger unchanged
        run: git diff --exit-code -- data/dataloka-wp-state.json

  send-to-dataloka:
    if: github.event_name != 'pull_request' && vars.BMKG_GEMPA_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 285
    permissions:
      contents: write
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'keeper' }}
      WP_USERNAME: ${{ secrets.DATALOKA_WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.DATALOKA_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow==12.0.0"
      - name: Validate publisher
        run: |
          python -m py_compile scripts/dataloka_wp_gempa.py scripts/dataloka_gempa_image.py
          bash -n scripts/run-dataloka-gempa.sh
          python -m unittest discover -s tests -p test_dataloka_wp_gempa.py -v
          git diff --exit-code -- data/dataloka-wp-state.json
      - name: Check WordPress credentials before live requests
        if: env.MODE == 'live'
        run: |
          test -n "$WP_USERNAME" || { echo "Missing DATALOKA_WP_USERNAME secret"; exit 1; }
          test -n "$WP_APP_PASSWORD" || { echo "Missing DATALOKA_WP_APP_PASSWORD secret"; exit 1; }
      - name: Process BMKG feeds and persist each cycle
        run: |
          if [[ "$TASK" == keeper ]]; then
            TASK=auto bash scripts/run-dataloka-gempa.sh 27 600
          else
            bash scripts/run-dataloka-gempa.sh 1 600
          fi
