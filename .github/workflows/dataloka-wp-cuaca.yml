name: Dataloka | Cuaca ekstrem BMKG (live)

on:
  pull_request:
    paths:
      - '.github/workflows/dataloka-wp-cuaca.yml'
      - 'scripts/dataloka_wp_cuaca.py'
      - 'scripts/dataloka_cuaca_image.py'
      - 'tests/test_dataloka_wp_cuaca.py'
      - 'tests/fixtures/nowcast-sample.xml'
      - 'scripts/run-cuaca-cycle.sh'
      - 'scripts/dataloka-cuaca-keeper.sh'
      - '.github/workflows/dataloka-wp-cuaca-keeper.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: "fixture = offline; dry-run = periksa API tanpa WP; live = terbit ke WordPress"
        required: true
        type: choice
        default: fixture
        options: [fixture, dry-run, live]
permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('dataloka-nowcast-pr-{0}', github.event.pull_request.number) || 'dataloka-nowcast-only' }}
  cancel-in-progress: false

jobs:
  tests:
    if: >-
      github.event_name != 'schedule' || vars.BMKG_NOWCAST_PAUSED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pillow for featured artwork
        run: python -m pip install "Pillow==12.0.0"
      - name: Check Python syntax
        run: python -m py_compile scripts/dataloka_wp_cuaca.py scripts/dataloka_cuaca_image.py
      - name: Check weather shell scripts
        run: |
          for script in scripts/save-cuaca-state.sh scripts/run-cuaca-cycle.sh scripts/dataloka-cuaca-keeper.sh; do bash -n "$script" || exit 1; done
      - name: Run isolated weather automation tests
        run: python -m unittest discover -s tests -p 'test_dataloka_wp_cuaca.py' -v
      - name: Check real BMKG CAP feed without WordPress (diagnostic)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from dataloka_wp_cuaca import fetch_rss, parse_rss, fetch_xml, parse_cap
          items = parse_rss(fetch_rss())
          print(f"Official BMKG CAP RSS accepted: {len(items)} links")
          if items:
              entry = parse_cap(fetch_xml(items[0]["url"]), items[0]["url"])
              print(f"First official CAP parse accepted: {entry['identifier']}")
          PY

  weather-publisher:
    needs: tests
    if: >-
      github.event_name != 'pull_request' &&
      vars.BMKG_NOWCAST_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      # Owner confirmed written authorization for BMKG CAP use on 22 Nov 2026.
      # Set repository variable BMKG_NOWCAST_PAUSED=true to halt all live checks.
      BMKG_NOWCAST_AUTHORIZED: 'true'
      WP_USERNAME: ${{ secrets.DATALOKA_WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.DATALOKA_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow==12.0.0"
      - name: Collect all active BMKG alerts
        if: env.MODE == 'live'
        run: python scripts/dataloka_wp_cuaca.py --mode collect
      - name: Save the queue before contacting WordPress
        if: env.MODE == 'live'
        run: bash scripts/save-cuaca-state.sh
      - name: Confirm complete BMKG collection to monitor
        if: env.MODE == 'live'
        continue-on-error: true
        env:
          PING_URL: ${{ secrets.CUACA_HEALTHCHECK_URL }}
        run: |
          if [[ -n "$PING_URL" ]] && jq -e '.unread_urls == []' data/dataloka-cuaca-state.json >/dev/null; then
            curl -fsS --max-time 10 -o /dev/null "$PING_URL"
          fi
      - name: Require WordPress credentials for live
        if: env.MODE == 'live'
        run: |
          test -n "$WP_USERNAME" || { echo "Missing DATALOKA_WP_USERNAME"; exit 1; }
          test -n "$WP_APP_PASSWORD" || { echo "Missing DATALOKA_WP_APP_PASSWORD"; exit 1; }
      - name: Publish queued alerts
        if: env.MODE == 'live'
        run: python scripts/dataloka_wp_cuaca.py --mode publish-queue
      - name: Run requested preview
        if: env.MODE != 'live'
        run: python scripts/dataloka_wp_cuaca.py --mode "$MODE"
      - name: Save publication results
        if: ${{ always() && env.MODE == 'live' }}
        run: bash scripts/save-cuaca-state.sh
