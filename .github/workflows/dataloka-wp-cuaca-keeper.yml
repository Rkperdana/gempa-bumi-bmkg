name: Dataloka | Penjaga cuaca tiap 10 menit

on:
  workflow_dispatch:
  schedule:
    - cron: '7 3,8,13,18,23 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dataloka-wp-cuaca-keeper.yml'
      - 'scripts/dataloka-cuaca-keeper.sh'
      - 'scripts/run-cuaca-cycle.sh'

permissions:
  contents: read

concurrency:
  group: dataloka-nowcast-only
  cancel-in-progress: false

jobs:
  keeper:
    if: vars.BMKG_NOWCAST_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      BMKG_NOWCAST_AUTHORIZED: 'true'
      WP_USERNAME: ${{ secrets.DATALOKA_WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.DATALOKA_WP_APP_PASSWORD }}
      PING_URL: ${{ secrets.CUACA_HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow==12.0.0"
      - name: Check Python and shell syntax
        run: |
          python -m py_compile scripts/dataloka_wp_cuaca.py scripts/dataloka_cuaca_image.py
          bash -n scripts/save-cuaca-state.sh scripts/run-cuaca-cycle.sh scripts/dataloka-cuaca-keeper.sh
      - name: Run isolated weather tests
        run: python -m unittest discover -s tests -p 'test_dataloka_wp_cuaca.py' -v
      - name: Check BMKG and WordPress every 10 minutes
        run: bash scripts/dataloka-cuaca-keeper.sh 34 600
