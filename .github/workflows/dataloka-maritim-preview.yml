name: Dataloka | Maritim (pilot preview)
on:
  pull_request:
    paths:
      - 'scripts/dataloka_maritim.py'
      - 'tests/test_dataloka_maritim.py'
      - 'tests/test_dataloka_wp_maritim.py'
      - 'scripts/dataloka_wp_maritim.py'
      - '.github/workflows/dataloka-maritim-preview.yml'
  workflow_dispatch:
  schedule:
    - cron: '12,42 * * * *'
permissions:
  contents: read
concurrency:
  group: dataloka-maritim-preview-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow==12.0.0"
      - run: python -m py_compile scripts/dataloka_maritim.py scripts/dataloka_wp_maritim.py
      - run: python -m unittest discover -s tests -p 'test_dataloka*maritim.py' -v
      - run: python scripts/dataloka_maritim.py
      - uses: actions/upload-artifact@v4
        with:
          name: maritim-featured-images
          path: maritim-preview/
          retention-days: 7
  authorized-preview:
    if: github.event_name != 'pull_request' && vars.BMKG_MARITIM_AUTHORIZED == 'true' && vars.BMKG_MARITIM_LIVE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BMKG_MARITIM_AUTHORIZED: ${{ vars.BMKG_MARITIM_AUTHORIZED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow==12.0.0"
      - run: python scripts/dataloka_maritim.py --authorized-wave
      - uses: actions/upload-artifact@v4
        with:
          name: wave-editorial-previews
          path: maritim-preview/
          retention-days: 7
      - name: Inspect rob schema (no publication)
        run: python scripts/dataloka_maritim.py --inspect-rob

  wave-live:
    if: github.event_name != 'pull_request' && vars.BMKG_MARITIM_AUTHORIZED == 'true' && vars.BMKG_MARITIM_LIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      BMKG_MARITIM_AUTHORIZED: ${{ vars.BMKG_MARITIM_AUTHORIZED }}
      BMKG_MARITIM_LIVE: ${{ vars.BMKG_MARITIM_LIVE }}
      WP_USERNAME: ${{ secrets.DATALOKA_WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.DATALOKA_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow==12.0.0"
      - run: python -m unittest discover -s tests -p 'test_dataloka*maritim.py' -v
      - name: Process verified wave warnings only
        id: publish
        run: python scripts/dataloka_wp_maritim.py
      - name: Persist isolated maritime ledger even on partial failure
        if: ${{ !cancelled() && (steps.publish.outcome == 'success' || steps.publish.outcome == 'failure') }}
        run: |
          set -euo pipefail
          if [[ ! -f data/dataloka-maritim-state.json ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dataloka-maritim-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: sync isolated Dataloka maritime ledger"
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep "$attempt"
          done
          exit 1
